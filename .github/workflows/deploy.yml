name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) CI: 质量门禁
  #    触发条件:任何 push 到 main、任何 v* tag、手动 dispatch
  #    作用:lint + test + build;通过后 deploy job 才会真正改 gh-pages
  ci:
    name: Lint + Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./app

      - name: Lint
        run: pnpm lint
        working-directory: ./app

      - name: Test
        run: pnpm test
        working-directory: ./app

      - name: Build app
        run: pnpm build
        working-directory: ./app

  # 2) Deploy: 把 dist 推到 gh-pages 分支
  #    只在(v* tag 被 push)或(workflow_dispatch 手动触发)时跑
  #    依赖 ci job 通过——避免上线坏构建
  deploy:
    name: Deploy to gh-pages
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./app

      - name: Build app
        run: pnpm build
        working-directory: ./app

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/dist
          publish_branch: gh-pages
          keep_files: false
          # tag 名字写入 commit message,gh-pages 历史一目了然
          commit_message: 'deploy: ${{ github.ref_name }}'